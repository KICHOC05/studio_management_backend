spring.application.name=studio-management-backend
spring.config.import=optional:file:.env.local[.properties]

#Database connection
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway uses the same datasource configured above, including .env.local values.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Flyway owns schema creation; Hibernate only validates entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:studio-management-backend}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}

app.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Fixed-window request limits per IP and application instance.
app.rate-limit.requests=${RATE_LIMIT_REQUESTS:120}
app.rate-limit.login-requests=${RATE_LIMIT_LOGIN_REQUESTS:5}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.max-clients=${RATE_LIMIT_MAX_CLIENTS:10000}
# Do not allow client-supplied forwarding headers to change the rate-limit identity.
server.forward-headers-strategy=none
